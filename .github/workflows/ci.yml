name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Backend: install + typecheck ────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: signaling-server/package-lock.json
      - name: Backend — install & typecheck
        working-directory: signaling-server
        run: |
          npm ci
          npx tsc --noEmit

      # ── Frontend: install + lint + typecheck + build ───────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Frontend — install, lint, build
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build

      # ── RAG retrieval quality gate ──────────────────────────────────────
      - name: RAG eval gate (hit@3 ≥ 0.90)
        working-directory: signaling-server
        run: |
          npx tsc --module nodenext --moduleResolution nodenext \
            --target es2022 --skipLibCheck --strict false \
            --outDir .evalbuild scripts/rag-eval.mts \
            src/rag/embedder.ts src/rag/chunker.ts src/rag/types.ts
          node .evalbuild/scripts/rag-eval.mjs
        env:
          # transformers.js model cache lives here between runs
          TRANSFORMERS_CACHE: ${{ github.workspace }}/signaling-server/.hf-cache

      - name: Cache HuggingFace models
        if: always()
        uses: actions/cache@v4
        with:
          path: signaling-server/.hf-cache
          key: hf-models-bge-small-v1.5

      - name: Cleanup build artifacts
        if: always()
        run: rm -rf signaling-server/.evalbuild
